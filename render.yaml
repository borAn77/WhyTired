# Render Blueprint (New → Blueprint → pick this repo): the API and the frontend.
services:
  # FastAPI backend: rule engine, data, LLM explanations
  - type: web
    name: whytired-api
    runtime: python
    plan: free
    rootDir: backend
    branch: main
    buildCommand: pip install uv && uv sync --frozen --no-dev
    startCommand: uv run --no-dev uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: LLM_PROVIDER
        value: anthropic
      - key: ANTHROPIC_MODEL
        value: claude-haiku-4-5
      - key: ANTHROPIC_API_KEY
        sync: false # set the value in the Render dashboard, never in git

  # React frontend as a free static site (CDN, no cold start)
  - type: web
    name: whytired
    runtime: static
    rootDir: frontend
    branch: main
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: VITE_API_URL
        value: https://whytired-api.onrender.com
    routes:
      - type: rewrite # single-page app: /detective, /s/<token> … all load index.html
        source: /*
        destination: /index.html
