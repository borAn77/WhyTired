# Keeps the demo API awake while the judges look at the project (docs/DECISIONS.md, D20).
# Render's free plan puts the API to sleep after 15 minutes without requests, and waking it
# takes 30–60 s, so a judge opening the demo cold would see "Waking up the server" first.
# This pings the health endpoint every 5 minutes: GitHub can delay or skip scheduled runs, so
# every 10 could leave a gap over 15. Scheduled runs only start from the default branch (main).
# Delete this file after the final presentation.
name: Keep the demo API awake

on:
  schedule:
    - cron: '2-59/5 * * * *' # every 5 minutes, off the busy top of the hour
  workflow_dispatch: # "Run workflow" button in the Actions tab

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping /api/health
        run: curl --fail --silent --show-error --max-time 90 --retry 2 --retry-delay 10 https://whytired-api.onrender.com/api/health
